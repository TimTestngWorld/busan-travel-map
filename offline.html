<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769aa">
<title>釜山旅行地圖｜離線</title>
<style>
html,body{height:100%;margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;background:#f4f7f9;color:#243846}
main{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(520px,100%);background:#fff;border:1px solid #dfe7ec;border-radius:22px;padding:28px;box-shadow:0 16px 50px #214d6b18}
.ico{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:#eaf4fb;font-size:38px}h1{font-size:25px;margin:18px 0 8px}p{font-size:15px;line-height:1.7;color:#667782}.note{margin-top:16px;border-radius:14px;background:#f6f8fa;padding:14px;font-size:13px;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button,a{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:#1769aa;color:#fff}.secondary{background:#edf2f5;color:#294659}
</style>
</head>
<body><main><section class="card"><div class="ico">🗺️</div><h1>目前沒有網路</h1><p>釜山旅行地圖的核心 App、已保存的 Day 行程、收藏與分帳資料仍會保留。即時搜尋、Kakao／OSM 地圖底圖、Google 實景照片與官方即時資訊需要連線。</p><div class="note">如果你已經使用過 Beta 2.12.2 PWA，回到 App 主頁通常仍可查看快取的核心資料。重新連線後，外部地圖與即時服務會自動恢復。</div><div class="actions"><button class="primary" onclick="location.reload()">重新嘗試</button><a class="secondary" href="./">回 App 首頁</a></div></section></main></body>
</html>
