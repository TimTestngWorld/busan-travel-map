<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=8,user-scalable=yes">
<title>釜山 80 景點｜旅行地圖完整版 Beta</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#eee9df;--panel:#fffdf9;--ink:#293137;--dark:#263238;--accent:#f2b34a;--naver:#03c75a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;color:var(--ink)}
body{overflow:hidden}
button,input,select{font-family:inherit}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}

.toolbar{min-height:60px;background:var(--dark);color:white;display:flex;align-items:center;gap:7px;padding:8px 10px;z-index:1000;box-shadow:0 2px 8px #0003;flex-wrap:wrap}
.brand{font-size:15px;font-weight:900}
.toolbar select,.toolbar button{border:0;border-radius:9px;padding:9px 10px;background:white;color:#263238;font-weight:800;cursor:pointer}
.toolbar select{max-width:310px}
.toolbar .primary{background:var(--accent);color:#222}
.toolbar .airport{background:#dcedf8;color:#214c65}
.toolbar .locate{background:#dceee3;color:#245b3a}
.toolbar .travel{background:#f7dfec;color:#713b59}
#status{margin-left:auto;color:#cae6d1;font-size:11px;font-weight:900}

.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 365px;gap:7px;padding:7px}
.viewer{position:relative;min-width:0;min-height:0;overflow:hidden;background:#dce3e5;border:1px solid #bbb3a8;border-radius:11px}
#map{position:absolute;inset:0;z-index:1}
#overlay{position:absolute;inset:0;width:100%;height:100%;z-index:500;pointer-events:none;overflow:visible}
#overlay .badge,#overlay .dot{pointer-events:auto;cursor:pointer}
.map-title{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:600;background:#fffffff2;border:1px solid #aaa;border-radius:10px;padding:7px 12px;font-size:14px;font-weight:900;pointer-events:none;text-align:center;max-width:76%}
.map-title small{display:block;font-size:10px;font-weight:600;color:#666;margin-top:2px}
.hint{position:absolute;left:9px;bottom:9px;z-index:600;background:#fffffff2;border:1px solid #aaa;border-radius:7px;padding:5px 7px;font-size:9px;pointer-events:none;max-width:73%}

.side{min-height:0;display:grid;grid-template-rows:auto 1fr;background:var(--panel);border:1px solid #d2ccc1;border-radius:11px;overflow:hidden}
.filters{padding:9px;border-bottom:1px solid #ddd;background:#fff}
.filters h3{font-size:13px;margin:0 0 7px}
.search{width:100%;border:1px solid #bbb;border-radius:8px;padding:9px 10px;font-size:12px;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.check-chip input{display:none}
.check-chip span{display:inline-flex;align-items:center;gap:3px;border:1px solid #c8c4bb;border-radius:999px;padding:6px 8px;font-size:10px;font-weight:800;background:#fff;cursor:pointer}
.check-chip input:checked+span{background:#263238;color:white;border-color:#263238}
.check-chip small{font-size:9px;opacity:.75}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.filter-grid select{width:100%;border:1px solid #bbb;border-radius:7px;padding:7px 6px;font-size:10px;background:white}
.filter-row{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.toggle-label{font-size:10px;font-weight:800;display:flex;gap:5px;align-items:center}
.small-btn{border:1px solid #bbb;background:white;border-radius:7px;padding:6px 8px;font-size:10px;font-weight:800;cursor:pointer}

.result-head{display:flex;justify-content:space-between;align-items:center;padding:8px 9px;border-bottom:1px solid #ddd;background:#faf8f2;font-size:11px;font-weight:900}
#results{min-height:0;overflow:auto;padding:5px}
.result-item{width:100%;border:1px solid #e0ddd6;background:#fff;border-radius:8px;padding:7px;margin-bottom:5px;text-align:left;cursor:pointer;display:grid;grid-template-columns:46px 1fr auto;gap:5px;align-items:start}
.result-item:hover{background:#f3f6f4}
.result-id{font-size:11px;font-weight:900}
.result-name{font-size:11px;font-weight:800;line-height:1.3}
.result-meta{font-size:9px;color:#777;margin-top:3px;line-height:1.4}
.result-tags{font-size:10px;text-align:right;white-space:nowrap}
.dist{color:#2d7a55;font-weight:900}

#info{position:absolute;right:9px;bottom:9px;z-index:720;width:min(430px,calc(100% - 18px));max-height:72%;overflow:auto;background:#fffffff9;border:1px solid #999;border-radius:11px;padding:10px;box-shadow:0 4px 18px #0004;display:none}
#info .close{float:right;border:0;background:#eee;border-radius:50%;width:26px;height:26px;cursor:pointer}
#info h3{margin:0 32px 7px 0;font-size:16px}
#info p{margin:4px 0;font-size:11px;line-height:1.55}
.info-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.link-btn{display:inline-block;text-decoration:none;border:0;border-radius:8px;padding:8px 9px;background:#2f6f9c;color:white;font-size:11px;font-weight:900;cursor:pointer}
.link-btn.secondary{background:#54646f}
.link-btn.naver{background:var(--naver)}
.link-btn.copy{background:#866b42}
.state-panel{border-top:1px solid #ddd;border-bottom:1px solid #ddd;padding:8px 0;margin:8px 0}
.state-buttons{display:flex;gap:5px;flex-wrap:wrap}
.state-btn{border:1px solid #bbb;border-radius:999px;background:white;padding:6px 8px;font-size:10px;font-weight:900;cursor:pointer}
.state-btn.active{background:#263238;color:#fff;border-color:#263238}
.day-line{display:flex;gap:6px;align-items:center;margin-top:7px}
.day-line select{border:1px solid #bbb;border-radius:7px;padding:6px;font-size:10px}
.nearby-box{margin-top:10px;border-top:1px solid #ddd;padding-top:8px}
.nearby-box h4{margin:0 0 5px;font-size:11px}
.nearby-item{width:100%;border:0;border-radius:7px;background:#f2f4f2;padding:6px;margin:3px 0;text-align:left;font-size:10px;cursor:pointer}
.url-note{word-break:break-all;color:#58697a;font-size:9px!important}

#filterBtn,#resultsBtn{display:none}
#sheetBackdrop{display:none}
.mobile-sheet{display:none}
#travelBar{display:none}

body.travel-mode .side{display:none}
body.travel-mode .main{grid-template-columns:1fr}
body.travel-mode .toolbar .hide-travel{display:none}
body.travel-mode .map-title{top:7px}
body.travel-mode .hint{display:none}


.itinerary-modal{display:none;position:fixed;inset:0;z-index:2200;background:#0006;padding:12px}
.itinerary-modal.show{display:flex;align-items:center;justify-content:center}
.itinerary-card{width:min(1100px,96vw);height:min(820px,94vh);background:#fffdf9;border-radius:16px;box-shadow:0 8px 36px #0006;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.itinerary-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;background:#263238;color:#fff}
.itinerary-head strong{font-size:15px}
.itinerary-head button,.itinerary-head select{border:0;border-radius:8px;padding:8px 9px;font-weight:900}
.itinerary-head .close-itin{margin-left:auto}
.itinerary-main{min-height:0;display:grid;grid-template-columns:190px 1fr}
.day-list{overflow:auto;border-right:1px solid #ddd;padding:7px;background:#f7f3ea}
.day-tab{width:100%;border:1px solid #ddd;background:#fff;border-radius:8px;padding:9px 8px;margin-bottom:5px;text-align:left;font-size:11px;font-weight:900;cursor:pointer}
.day-tab.active{background:#263238;color:#fff}
.day-tab small{display:block;font-size:9px;opacity:.75;margin-top:2px}
.day-content{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr}
.day-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:9px;border-bottom:1px solid #ddd;background:#fff}
.day-tools button{border:1px solid #bbb;background:#fff;border-radius:7px;padding:7px 8px;font-size:10px;font-weight:900;cursor:pointer}
.day-tools .add{background:#dceee3;border-color:#a8cbb7}
.day-tools .mapday{background:#dcedf8;border-color:#a6c8de}
.day-tools .today{background:#f7dfec;border-color:#dcb5ca}
.itinerary-items{overflow:auto;padding:8px}
.itin-item{display:grid;grid-template-columns:42px 58px minmax(0,1fr) auto;gap:7px;align-items:start;border:1px solid #dedad2;background:#fff;border-radius:9px;padding:8px;margin-bottom:6px}
.itin-order{font-weight:900;color:#555;text-align:center}
.itin-time{font-weight:900;color:#3c6b88;font-size:11px}
.itin-name{font-size:11px;font-weight:900}
.itin-note{font-size:9px;color:#666;line-height:1.5;margin-top:3px}
.itin-actions{display:flex;flex-direction:column;gap:3px}
.itin-actions button{border:0;border-radius:6px;padding:5px;font-size:9px;font-weight:900;cursor:pointer}
.itin-editor{display:none;position:fixed;inset:0;z-index:2400;background:#0006;align-items:center;justify-content:center;padding:12px}
.itin-editor.show{display:flex}
.editor-card{width:min(560px,96vw);max-height:92vh;overflow:auto;background:#fffdf9;border-radius:14px;padding:13px;box-shadow:0 6px 28px #0006}
.editor-card h3{margin:0 0 9px;font-size:15px}
.editor-card label{display:block;font-size:10px;font-weight:900;margin:8px 0 3px}
.editor-card select,.editor-card input,.editor-card textarea{width:100%;border:1px solid #bbb;border-radius:8px;padding:8px;font-size:11px}
.editor-card textarea{min-height:72px;resize:vertical}
.editor-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:10px}
.editor-actions button{border:0;border-radius:8px;padding:8px 10px;font-weight:900}
.poi-gallery{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.poi-gallery img{width:100%;height:120px;object-fit:cover;border-radius:9px;border:1px solid #ddd;background:#eee}
.photo-placeholder{height:120px;border:1px dashed #bbb;border-radius:9px;background:#f2f1ed;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:10px;color:#777}
.photo-note{font-size:9px;color:#777;margin:-2px 0 7px}
.today-badge{background:#ee7eae;color:white;padding:2px 5px;border-radius:999px;font-size:8px;margin-left:4px}
@media(max-width:900px){
 .itinerary-modal{padding:5px}
 .itinerary-card{width:100%;height:96vh;border-radius:12px}
 .itinerary-main{grid-template-columns:105px 1fr}
 .day-list{padding:4px}
 .day-tab{padding:7px 5px;font-size:9px}
 .day-tab small{font-size:8px}
 .day-tools{padding:6px;gap:4px}
 .day-tools button{font-size:9px;padding:6px}
 .itin-item{grid-template-columns:30px 48px minmax(0,1fr);gap:4px}
 .itin-actions{grid-column:1/-1;flex-direction:row;justify-content:flex-end}
 .poi-gallery img,.photo-placeholder{height:100px}
}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:3000;background:#263238;color:white;padding:9px 12px;border-radius:9px;font-size:11px;font-weight:800;box-shadow:0 3px 14px #0004;display:none;max-width:88%;text-align:center}
.leaflet-control-attribution{font-size:9px!important}

@media(max-width:900px){
 .toolbar{padding:7px;gap:5px}
 .brand{width:100%;font-size:13px}
 .toolbar select{flex:1;max-width:none;min-width:0;font-size:11px;padding:8px 7px}
 .toolbar button{font-size:10px;padding:8px 8px}
 .toolbar .desktop-extra{display:none}
 #filterBtn,#resultsBtn{display:inline-block}
 #status{width:100%;margin-left:0;font-size:9px}
 .main{grid-template-columns:1fr;padding:4px}
 .side{display:none}
 .viewer{border-radius:7px}
 .map-title{top:7px;font-size:10px;max-width:72%;padding:5px 8px}
 .map-title small{font-size:8px}
 .hint{font-size:8px;max-width:82%;padding:4px 6px}

 #sheetBackdrop.show{display:block;position:fixed;inset:0;background:#0005;z-index:1400}
 .mobile-sheet.show{display:block;position:fixed;left:7px;right:7px;bottom:7px;max-height:80%;z-index:1500;background:#fffdf9;border:1px solid #999;border-radius:13px;box-shadow:0 6px 28px #0005;overflow:auto}
 .sheet-head{position:sticky;top:0;z-index:2;background:#fffdf9;border-bottom:1px solid #ddd;padding:9px;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:12px}
 .sheet-close{border:0;border-radius:7px;padding:7px 9px;font-weight:900}
 .sheet-body{padding:9px}
 #mobileResults{padding:6px}

 body.travel-mode #travelBar{display:grid;position:fixed;left:6px;right:6px;bottom:6px;z-index:1300;grid-template-columns:repeat(5,1fr);gap:4px;background:#263238ee;padding:6px;border-radius:12px;box-shadow:0 4px 16px #0005}
 #travelBar button{border:0;border-radius:8px;background:white;padding:8px 3px;font-size:9px;font-weight:900}
 body.travel-mode .viewer{margin-bottom:54px}
}
</style>
</head>
<body>
<div id="app">
 <div class="toolbar">
  <div class="brand">釜山 80 景點旅行地圖 Beta</div>
  <select id="viewSelect"><option value="1">1｜釜山 80 景點總覽（80）</option><option value="2">2｜N＋SD 南浦／中央／松島（12）</option><option value="3">3｜Y＋BS 影島／釜山站（5）</option><option value="4">4｜S＋DY 西面／田浦／大淵（17）</option><option value="5">5｜G 廣安里／水營／南川／民樂（13）</option><option value="6">6｜C＋H Centum／冬柏／海雲台／海理團（24）</option><option value="7">7｜CS＋K 青沙浦／機張／日光（6）</option><option value="8">8｜SA＋DN 沙上／東萊（3）</option></select>
  <button id="filterBtn">篩選</button>
  <button id="resultsBtn">結果</button>
  <button id="locateBtn" class="locate">📍我的位置</button>
  <button id="airportBtn" class="airport">✈ 金海機場</button>
  <button id="travelModeBtn" class="travel">旅行模式</button>
  <button id="itineraryBtn" style="background:#e9def8;color:#553b78">📅 我的行程</button>
  <button id="layerBtn" class="desktop-extra hide-travel">底圖：人道救援</button>
  <button id="fitBtn" class="desktop-extra hide-travel">顯示結果</button>
  <button id="exportBtn" class="primary desktop-extra hide-travel">匯出 PNG</button>
  <span id="status">載入中…</span>
 </div>

 <div class="main">
  <div class="viewer" id="viewer">
    <div id="map"></div>
    <svg id="overlay"></svg>
    <div class="map-title" id="mapTitle">1｜釜山 80 景點總覽<small>80 個收藏點</small></div>
    <div class="hint">1～8 快速切區｜類別／狀態／Day／距離／URL／搜尋可交叉｜點景點可導航、排 Day、看附近順遊</div>
    <div id="info">
      <button class="close" id="closeInfo">×</button>
      <h3 id="infoTitle"></h3>
      <div id="infoBody"></div>
      <div class="state-panel" id="statePanel"></div>
      <div class="info-actions" id="infoActions"></div>
      <div class="nearby-box" id="nearbyBox"></div>
    </div>
  </div>

  <aside class="side">
    <div class="filters">
      <h3>交叉篩選</h3>
      <input id="searchBox" class="search" placeholder="搜尋名稱、韓文、地址、備註、URL…">
      <div class="chips"><label class="check-chip"><input type="checkbox" class="cat-check" value="餐廳"><span>餐廳 <small>44</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="咖啡廳"><span>咖啡廳 <small>20</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="旅遊景點"><span>旅遊景點 <small>6</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="購物"><span>購物 <small>4</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="交通"><span>交通 <small>1</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="公共設施"><span>公共設施 <small>1</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="住宿"><span>住宿 <small>1</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="酒吧"><span>酒吧 <small>1</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="休閒娛樂"><span>休閒娛樂 <small>1</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="地址／地點"><span>地址／地點 <small>1</small></span></label></div>
      <div class="filter-grid">
        <select id="statusFilter">
          <option value="">全部狀態</option>
          <option value="unset">未設定</option>
          <option value="wish">★ 想去</option>
          <option value="visited">✓ 已去</option>
          <option value="skip">× 暫時不去</option>
        </select>
        <select id="dayFilter"><option value="">全部行程日</option><option value="unassigned">未排行程</option><option value="1">Day 1</option><option value="2">Day 2</option><option value="3">Day 3</option><option value="4">Day 4</option><option value="5">Day 5</option><option value="6">Day 6</option><option value="7">Day 7</option><option value="8">Day 8</option><option value="9">Day 9</option><option value="10">Day 10</option><option value="11">Day 11</option><option value="12">Day 12</option><option value="13">Day 13</option><option value="14">Day 14</option></select>
        <select id="radiusFilter">
          <option value="">不限距離</option>
          <option value="0.5">500 m 內</option>
          <option value="1">1 km 內</option>
          <option value="3">3 km 內</option>
          <option value="5">5 km 內</option>
        </select>
        <select id="sortSelect">
          <option value="default">原分區順序</option>
          <option value="distance">距離最近</option>
          <option value="id">依 ID</option>
        </select>
      </div>
      <div class="filter-row">
        <label class="toggle-label"><input type="checkbox" id="urlOnly"> 僅有 URL（61）</label>
        <button class="small-btn" id="clearFilters">清除篩選</button>
      </div>
      <div class="filter-row">
        <button class="small-btn" id="backupBtn">備份旅程狀態</button>
        <button class="small-btn" id="restoreBtn">匯入旅程狀態</button>
        <input type="file" id="restoreFile" accept=".json,application/json" hidden>
      </div>
    </div>
    <div style="min-height:0;display:grid;grid-template-rows:auto 1fr">
      <div class="result-head"><span id="resultCount">80 / 80</span><button class="small-btn" id="fitResultsSide">顯示全部結果</button></div>
      <div id="results"></div>
    </div>
  </aside>
 </div>
</div>

<div id="travelBar">
 <button id="travelArea">區域</button>
 <button id="travelNearby">附近</button>
 <button id="travelCategory">類別</button>
 <button id="travelSearch">搜尋</button>
 <button id="travelResults">結果</button>
</div>

<div id="sheetBackdrop"></div>
<div class="mobile-sheet" id="filterSheet">
 <div class="sheet-head"><span>交叉篩選</span><button class="sheet-close" data-close>完成</button></div>
 <div class="sheet-body">
   <input id="mobileSearchBox" class="search" placeholder="搜尋名稱、地址、備註、URL…">
   <div class="chips"><label class="check-chip"><input type="checkbox" class="cat-check" value="餐廳"><span>餐廳 <small>44</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="咖啡廳"><span>咖啡廳 <small>20</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="旅遊景點"><span>旅遊景點 <small>6</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="購物"><span>購物 <small>4</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="交通"><span>交通 <small>1</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="公共設施"><span>公共設施 <small>1</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="住宿"><span>住宿 <small>1</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="酒吧"><span>酒吧 <small>1</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="休閒娛樂"><span>休閒娛樂 <small>1</small></span></label><label class="check-chip"><input type="checkbox" class="cat-check" value="地址／地點"><span>地址／地點 <small>1</small></span></label></div>
   <div class="filter-grid">
     <select id="mobileStatusFilter">

const prefs={

 G:[90,65,115,35,145,0,180,270],S:[180,155,205,130,230,90,270,0],N:[180,145,215,110,250,90,270,0],

function svgEl(tag,attrs={},text=""){const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;return e}
function overlap(a,b,m=0){return !(a.x2+m<b.x1||a.x1-m>b.x2||a.y2+m<b.y1||a.y1-m>b.y2)}
function dims(id){return {w:Math.max(40,16+id.length*9.4),h:23}}
function escapeHTML(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escapeAttr(s){return escapeHTML(s)}
function norm(s){return String(s||"").toLocaleLowerCase()}
function haversine(lat1,lon1,lat2,lon2){
 const R=6371,rad=Math.PI/180,dLat=(lat2-lat1)*rad,dLon=(lon2-lon1)*rad;
 const a=Math.sin(dLat/2)**2+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.sqrt(a));
}
function fmtDist(km){return km<1?Math.round(km*1000)+" m":km.toFixed(km<10?1:0)+" km"}
function statusGlyph(s){return s==="visited"?"✓":s==="wish"?"★":s==="skip"?"×":""}
function statusLabel(s){return s==="visited"?"已去":s==="wish"?"想去":s==="skip"?"暫時不去":"未設定"}
function dayLabel(d){return d?`Day ${d}`:"未排"}
function selectedViewCodes(){return new Set(VIEWS[state.view].codes)}

function urlMeta(url){
 if(!url)return {icon:"",label:"",host:""};
 let host="";
 try{host=new URL(url).hostname.replace(/^www\./,"")}catch(e){return {icon:"🔗",label:"收藏連結",host:""}}
 const h=host.toLowerCase();
 if(h.includes("instagram.com"))return {icon:"📸",label:"Instagram",host};
 if(h.includes("threads.net")||h.includes("threads.com"))return {icon:"🧵",label:"Threads",host};
 if(h.includes("youtube.com")||h.includes("youtu.be"))return {icon:"▶️",label:"YouTube",host};
 if(h.includes("facebook.com")||h.includes("fb.com"))return {icon:"📘",label:"Facebook",host};
 if(h.includes("blog.naver.com"))return {icon:"🟢",label:"Naver Blog",host};
 if(h.includes("naver.com"))return {icon:"🟢",label:"Naver",host};
 if(h.includes("pixnet.net"))return {icon:"📝",label:"痞客邦",host};
 return {icon:"🌐",label:"網頁",host};
}

function computeFiltered(){
 const codes=selectedViewCodes(),q=norm(state.search).trim();
 let arr=ALL_RECORDS.filter(p=>{
   if(!codes.has(p.code))return false;
   if(state.categories.size&&!state.categories.has(p.category))return false;
   if(state.urlOnly&&!p.url)return false;
   const ps=poiState(p.id);
   if(state.statusFilter){
     if(state.statusFilter==="unset" && ps.status)return false;
     if(state.statusFilter!=="unset" && ps.status!==state.statusFilter)return false;
   }
   if(state.dayFilter){
     if(state.dayFilter==="unassigned" && ps.day)return false;
     if(state.dayFilter!=="unassigned" && String(ps.day)!==String(state.dayFilter))return false;
   }
   if(q){
     const hay=norm([p.id,p.display,p.name,p.category,p.address,p.memo,p.url,p.region].join(" "));
     if(!hay.includes(q))return false;
   }
   if(state.radius){
     if(!state.currentLocation)return false;
     const d=haversine(state.currentLocation.lat,state.currentLocation.lon,p.lat,p.lon);
     if(d>Number(state.radius))return false;
   }
   return true;
 });
 if(state.sort==="distance"&&state.currentLocation){
   arr.sort((a,b)=>haversine(state.currentLocation.lat,state.currentLocation.lon,a.lat,a.lon)-haversine(state.currentLocation.lat,state.currentLocation.lon,b.lat,b.lon));
 }else if(state.sort==="id"){arr.sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}))}
 state.filtered=arr;return arr;
}

function getBounds(points,includeAirport=false){
 const ll=points.map(p=>[p.lat,p.lon]);if(includeAirport)ll.push([AIRPORT.lat,AIRPORT.lon]);return ll.length?L.latLngBounds(ll):null
}
function fitToPoints(points,opts={}){
 if(!points.length)return;
 const b=getBounds(points,opts.includeAirport||false);if(!b)return;
 map.fitBounds(b,{padding:[38,38],animate:false,maxZoom:opts.maxZoom||16});
}
function applyView(shouldFit=true){
 computeFiltered();const v=VIEWS[state.view];
 if(shouldFit){const base=ALL_RECORDS.filter(p=>v.codes.includes(p.code));fitToPoints(base,{includeAirport:state.view==="1",maxZoom:15})}
 mapTitle.innerHTML=`${v.label}<small>${state.filtered.length} 個符合條件／區域共 ${v.count} 個</small>`;
 renderResults();renderOverlay();updateStatus();persist()
}
function applyFilters(shouldFit=false){
 computeFiltered();const v=VIEWS[state.view];
 mapTitle.innerHTML=`${v.label}<small>${state.filtered.length} 個符合條件／區域共 ${v.count} 個</small>`;
 renderResults();renderOverlay();if(shouldFit&&state.filtered.length)fitToPoints(state.filtered,{maxZoom:16});updateStatus()
}

 let near=arr.filter(x=>x._d<=1).slice(0,6),title="1 km 內";
 if(near.length<3){near=arr.filter(x=>x._d<=3).slice(0,6);title="附近 3 km 內"}
 if(!near.length)return "";
 return `<h4>🚶 附近順遊｜${title}</h4>`+near.map(x=>`<button class="nearby-item" onclick="focusAndInfo('${x.id}')"><b>${x.id}</b> ${escapeHTML(x.display)}｜${escapeHTML(x.category)}｜<b>${fmtDist(x._d)}</b></button>`).join("");
}

};

window.openNaverNavigation=function(id){
 const p=byId[id];if(!p)return;
 const dname=encodeURIComponent(p.name||p.display||p.id),appname=encodeURIComponent(APPNAME);
 const query=`navigation?dlat=${p.lat}&dlng=${p.lon}&dname=${dname}&appname=${appname}`;
 const ua=navigator.userAgent||"",isAndroid=/Android/i.test(ua),isIOS=/iPhone|iPad|iPod/i.test(ua);
 if(isAndroid){window.location.href=`intent://${query}#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end`;return}
 if(isIOS){
   const started=Date.now();window.location.href=`nmap://${query}`;
   setTimeout(()=>{if(Date.now()-started<2200)window.location.href="https://apps.apple.com/app/id311867728"},1500);return
 }
 window.open(`https://map.naver.com/p/search/${encodeURIComponent(p.name||p.display||p.id)}`,"_blank","noopener")
};

};

function renderOverlay(){
 const rect=document.getElementById("viewer").getBoundingClientRect(),w=rect.width,h=rect.height;if(!w||!h)return;
 overlay.setAttribute("viewBox",`0 0 ${w} ${h}`);overlay.replaceChildren();
 const visible=state.filtered.map(p=>{const q=map.latLngToContainerPoint([p.lat,p.lon]);return {...p,sx:q.x,sy:q.y}}).filter(p=>p.sx>-30&&p.sx<w+30&&p.sy>-30&&p.sy<h+30);
 visible.sort((a,b)=>(density[a.code]??99)-(density[b.code]??99)||a.sy-b.sy||a.sx-b.sx);
 const boxes=[],placed=[],mobile=innerWidth<=900,radii=mobile?[24,34,46,60,76,96,120,148,180]:[22,31,41,53,67,83,102,126,152,184,220];
 for(const p of visible){
   const d=dims(p.id),angles=prefs[p.code]||[0,90,180,270];let chosen=null;
   for(const rad of radii){for(const ang of angles){
     const a=ang*Math.PI/180,cx=p.sx+rad*Math.cos(a),cy=p.sy+rad*Math.sin(a),b={x1:cx-d.w/2,y1:cy-d.h/2,x2:cx+d.w/2,y2:cy+d.h/2,cx,cy};
     if(b.x1<3||b.y1<3||b.x2>w-3||b.y2>h-3||boxes.some(q=>overlap(b,q,3.4)))continue;chosen=b;break
   }if(chosen)break}
   if(chosen){boxes.push(chosen);placed.push({p,b:chosen})}
 }
 state.visibleLabels=placed.length;
 for(const p of visible){
   const ps=poiState(p.id),g=svgEl("g",{class:"dot","data-id":p.id});
   const opacity=ps.status==="visited"?.55:ps.status==="skip"?.35:1;
   g.setAttribute("opacity",opacity);
   g.append(svgEl("circle",{cx:p.sx,cy:p.sy,r:6,fill:"#fff"}));g.append(svgEl("circle",{cx:p.sx,cy:p.sy,r:4.1,fill:p.color}));
   const glyph=statusGlyph(ps.status);
   if(glyph)g.append(svgEl("text",{x:p.sx+7,y:p.sy-7,"font-size":9,"font-weight":900,fill:"#263238",stroke:"#fff","stroke-width":2,"paint-order":"stroke"},glyph));
   g.addEventListener("click",e=>{e.stopPropagation();showInfo(p.id)});overlay.append(g)
 }
 for(const item of placed){
   const p=item.p,b=item.b,ex=Math.max(b.x1,Math.min(p.sx,b.x2)),ey=Math.max(b.y1,Math.min(p.sy,b.y2));
   overlay.append(svgEl("line",{x1:p.sx,y1:p.sy,x2:ex,y2:ey,stroke:p.color,"stroke-width":1.35,opacity:.88}))
 }
 for(const item of placed){
   const p=item.p,b=item.b,ps=poiState(p.id),g=svgEl("g",{class:"badge","data-id":p.id});
   let fill=p.color;if(ps.status==="visited")fill="#658b70";else if(ps.status==="skip")fill="#888";
   g.append(svgEl("rect",{x:b.x1,y:b.y1,width:b.x2-b.x1,height:b.y2-b.y1,rx:5,fill,stroke:"#fff","stroke-width":1.45}));
   let txt=p.id+(ps.day?` D${ps.day}`:"");
   g.append(svgEl("text",{x:b.cx,y:b.cy+.7,"text-anchor":"middle","dominant-baseline":"middle","font-size":11.2,"font-weight":900,fill:"#fff"},txt));
   g.addEventListener("click",e=>{e.stopPropagation();showInfo(p.id)});overlay.append(g)
 }
 updateStatus(visible.length)
}

function updateStatus(visibleNow=null){
 const loaded=state.layer==="hot"?state.loadedHot:state.loadedStd,layer=state.layer==="hot"?"人道救援":"OSM Standard",v=visibleNow===null?state.filtered.length:visibleNow;
 const loc=state.currentLocation?"｜📍已定位":"";
 status.textContent=`${layer} ${loaded?"LIVE ✓":"載入中…"}｜View ${state.view}｜符合 ${state.filtered.length}｜畫面 ${v}｜標籤 ${state.visibleLabels}${loc}`
}
function toggleLayer(){
 if(state.layer==="hot"){map.removeLayer(hot);standard.addTo(map);state.layer="std";document.getElementById("layerBtn").textContent="底圖：OSM Standard"}
 else{map.removeLayer(standard);hot.addTo(map);state.layer="hot";document.getElementById("layerBtn").textContent="底圖：人道救援"}
 updateStatus();setTimeout(renderOverlay,120)
}
document.getElementById("layerBtn").onclick=toggleLayer;
document.getElementById("mobileLayerBtn").onclick=toggleLayer;

function locateMe(){
 if(!navigator.geolocation){toast("這個瀏覽器不支援定位");return}
 toast("正在取得目前位置…");
 navigator.geolocation.getCurrentPosition(pos=>{
   state.currentLocation={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy};
   if(myMarker)map.removeLayer(myMarker);
   myMarker=L.circleMarker([state.currentLocation.lat,state.currentLocation.lon],{radius:8,color:"#1769aa",fillColor:"#4da3e3",fillOpacity:.95,weight:3}).addTo(map).bindPopup(`我的位置<br>精度約 ${Math.round(pos.coords.accuracy)} m`);
   state.sort="distance";syncFilterControls();applyFilters(false);map.setView([state.currentLocation.lat,state.currentLocation.lon],14);myMarker.openPopup();toast("已取得目前位置，結果已依距離排序")
 },err=>{
   let msg="無法取得目前位置";
   if(location.protocol==="file:"||location.protocol==="content:")msg+="。本機 HTML 可能被手機瀏覽器限制定位；之後放到 HTTPS／PWA 會穩定很多。";
   toast(msg)
 },{enableHighAccuracy:true,timeout:10000,maximumAge:60000})
}
document.getElementById("locateBtn").onclick=locateMe;
document.getElementById("mobileLocate").onclick=locateMe;

function bindPair(a,b,field){
 const A=document.getElementById(a),B=document.getElementById(b);
 A.onchange=()=>{state[field]=A.value;B.value=A.value;if(field==="radius"&&state.radius&&!state.currentLocation){toast("請先使用「我的位置」取得定位");}applyFilters(false)};
 B.onchange=()=>{state[field]=B.value;A.value=B.value;if(field==="radius"&&state.radius&&!state.currentLocation){toast("請先使用「我的位置」取得定位");}applyFilters(false)}
}
bindPair("statusFilter","mobileStatusFilter","statusFilter");
bindPair("dayFilter","mobileDayFilter","dayFilter");
bindPair("radiusFilter","mobileRadiusFilter","radius");
bindPair("sortSelect","mobileSortSelect","sort");

viewSelect.onchange=()=>{state.view=viewSelect.value;applyView(true)};
function bindSearch(a,b){
 const A=document.getElementById(a),B=document.getElementById(b);
 A.oninput=()=>{state.search=A.value;B.value=A.value;applyFilters(false)};
 B.oninput=()=>{state.search=B.value;A.value=B.value;applyFilters(false)}
}
bindSearch("searchBox","mobileSearchBox");

document.querySelectorAll(".cat-check").forEach(chk=>chk.onchange=()=>{
 document.querySelectorAll(`.cat-check[value="${CSS.escape(chk.value)}"]`).forEach(x=>x.checked=chk.checked);
 state.categories=new Set([...document.querySelectorAll(".cat-check:checked")].map(x=>x.value));applyFilters(false)
});
function syncUrl(a,b){
 const A=document.getElementById(a),B=document.getElementById(b);
 A.onchange=()=>{state.urlOnly=A.checked;B.checked=A.checked;applyFilters(false)};
 B.onchange=()=>{state.urlOnly=B.checked;A.checked=B.checked;applyFilters(false)}
}
syncUrl("urlOnly","mobileUrlOnly");

function clearFilters(){
 state.categories.clear();state.search="";state.urlOnly=false;state.statusFilter="";state.dayFilter="";state.radius="";state.sort="default";
 document.querySelectorAll(".cat-check").forEach(x=>x.checked=false);
 ["searchBox","mobileSearchBox"].forEach(id=>document.getElementById(id).value="");
 ["urlOnly","mobileUrlOnly"].forEach(id=>document.getElementById(id).checked=false);
 syncFilterControls();applyFilters(false)
}
document.getElementById("clearFilters").onclick=clearFilters;document.getElementById("mobileClear").onclick=clearFilters;

document.getElementById("fitBtn").onclick=()=>fitToPoints(state.filtered,{maxZoom:16});
document.getElementById("fitResultsSide").onclick=()=>fitToPoints(state.filtered,{maxZoom:16});
document.getElementById("mobileFitBtn").onclick=()=>{fitToPoints(state.filtered,{maxZoom:16});closeSheets()};

function setTravelMode(on){
 state.travelMode=on;document.body.classList.toggle("travel-mode",on);
 document.getElementById("travelModeBtn").textContent=on?"退出旅行模式":"旅行模式";persist();setTimeout(()=>map.invalidateSize(),100)
}
document.getElementById("travelModeBtn").onclick=()=>setTravelMode(!state.travelMode);
setTravelMode(state.travelMode);

const backdrop=document.getElementById("sheetBackdrop"),filterSheet=document.getElementById("filterSheet"),resultsSheet=document.getElementById("resultsSheet");
function openSheet(s){backdrop.classList.add("show");s.classList.add("show")}
function closeSheets(){backdrop.classList.remove("show");filterSheet.classList.remove("show");resultsSheet.classList.remove("show")}
document.getElementById("filterBtn").onclick=()=>openSheet(filterSheet);
document.getElementById("resultsBtn").onclick=()=>openSheet(resultsSheet);
document.querySelectorAll("[data-close]").forEach(x=>x.onclick=closeSheets);backdrop.onclick=closeSheets;
document.getElementById("travelCategory").onclick=()=>openSheet(filterSheet);
document.getElementById("travelSearch").onclick=()=>{openSheet(filterSheet);setTimeout(()=>document.getElementById("mobileSearchBox").focus(),150)};
document.getElementById("travelResults").onclick=()=>openSheet(resultsSheet);
document.getElementById("travelNearby").onclick=locateMe;
document.getElementById("travelArea").onclick=()=>{viewSelect.focus();viewSelect.click?.();toast("請從上方選擇 1～8 區域")};

function exportPNG(){
 const btn=document.getElementById("exportBtn");if(btn){btn.disabled=true;btn.textContent="產生中…"}
 leafletImage(map,(err,mapCanvas)=>{
   if(err){toast("底圖匯出失敗："+err);if(btn){btn.disabled=false;btn.textContent="匯出 PNG"};return}
   try{
     const w=mapCanvas.width,h=mapCanvas.height,out=document.createElement("canvas");out.width=w;out.height=h;const c=out.getContext("2d");c.drawImage(mapCanvas,0,0);
     const svgText=new XMLSerializer().serializeToString(overlay),blob=new Blob([svgText],{type:"image/svg+xml;charset=utf-8"}),url=URL.createObjectURL(blob),img=new Image();
     img.onload=()=>{c.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);const a=document.createElement("a");a.download=`Busan80_View${state.view}_${state.layer==="hot"?"Humanitarian":"OSMStandard"}.png`;a.href=out.toDataURL("image/png");a.click();if(btn){btn.disabled=false;btn.textContent="匯出 PNG"}};
     img.onerror=()=>{URL.revokeObjectURL(url);toast("標籤匯出失敗");if(btn){btn.disabled=false;btn.textContent="匯出 PNG"}};img.src=url
   }catch(e){toast("匯出失敗："+e);if(btn){btn.disabled=false;btn.textContent="匯出 PNG"}}
 })
}
document.getElementById("exportBtn").onclick=exportPNG;
document.getElementById("mobileExportBtn").onclick=()=>{closeSheets();setTimeout(exportPNG,100)};

function backupState(){
 const payload={version:3,exportedAt:new Date().toISOString(),poi:saved.poi||{},ui:saved.ui||{},itinerary:saved.itinerary||{}};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="Busan80_TripState_Backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast("旅程狀態已備份")
}
document.getElementById("backupBtn").onclick=backupState;
document.getElementById("restoreBtn").onclick=()=>document.getElementById("restoreFile").click();
document.getElementById("restoreFile").onchange=async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try{
   const o=JSON.parse(await file.text());if(!o.poi)throw new Error("格式不符");
   saved={poi:o.poi||{},ui:o.ui||{},itinerary:o.itinerary||{}};persist();state.view=saved.ui?.view||state.view;viewSelect.value=state.view;setTravelMode(!!saved.ui?.travelMode);applyView(false);toast("旅程狀態已匯入")
 }catch(err){toast("匯入失敗：檔案格式不正確")}
 e.target.value=""
};


// ============================================================
// MY ITINERARY — Day 1 to Day 14
// ============================================================
let itineraryDay=Number(saved.ui?.itineraryDay||1);
let editorMode="add", editorIndex=-1, editorDay=1;

function itineraryData(){
 if(!saved.itinerary)saved.itinerary={};
 for(let d=1;d<=14;d++)if(!Array.isArray(saved.itinerary[d]))saved.itinerary[d]=[];
 return saved.itinerary;
}
function saveItinerary(){
 itineraryData();saved.ui.itineraryDay=itineraryDay;
 try{localStorage.setItem(STORE_KEY,JSON.stringify(saved))}catch(e){}
}
function dayItems(day){return itineraryData()[String(day)]||itineraryData()[day]||[]}
function dayCounts(){
 const out={};for(let d=1;d<=14;d++)out[d]=dayItems(d).length;return out
}
function renderDayList(){
 const today=Number(saved.ui?.todayDay||0),counts=dayCounts();
 document.getElementById("dayList").innerHTML=Array.from({length:14},(_,i)=>i+1).map(d=>
  `<button class="day-tab ${d===itineraryDay?"active":""}" data-day="${d}">Day ${d}${today===d?'<span class="today-badge">今天</span>':""}<small>${counts[d]} 個景點</small></button>`
 ).join("");
 document.querySelectorAll(".day-tab").forEach(b=>b.onclick=()=>{itineraryDay=Number(b.dataset.day);saveItinerary();renderItinerary()})
}
function renderItinerary(){
 renderDayList();
 const items=dayItems(itineraryDay),today=Number(saved.ui?.todayDay||0);
 document.getElementById("dayTitle").innerHTML=`Day ${itineraryDay}${today===itineraryDay?'<span class="today-badge">今天</span>':""}`;
 const total=Object.values(itineraryData()).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0);
 document.getElementById("itinerarySummary").textContent=`共 ${total} 個行程項目`;
 document.getElementById("itineraryItems").innerHTML=items.length?items.map((it,i)=>{
   const p=byId[it.id]||{};
   return `<div class="itin-item">
    <div class="itin-order">#${i+1}<br><button onclick="moveItin(${itineraryDay},${i},-1)" style="border:0;background:none">▲</button><button onclick="moveItin(${itineraryDay},${i},1)" style="border:0;background:none">▼</button></div>
    <div class="itin-time">${escapeHTML(it.time||"未定")}</div>
    <div><div class="itin-name"><span style="color:${p.color||"#555"}">${escapeHTML(it.id)}</span> ${escapeHTML(p.display||it.id)}</div>
      ${it.note?`<div class="itin-note">📝 ${escapeHTML(it.note)}</div>`:""}
      ${it.transport?`<div class="itin-note">🚇 ${escapeHTML(it.transport)}</div>`:""}
    </div>
    <div class="itin-actions">
      <button onclick="focusAndInfo('${it.id}')">地圖</button>
      <button onclick="editItin(${itineraryDay},${i})">編輯</button>
      <button onclick="removeItin(${itineraryDay},${i})" style="background:#f4dddd">移除</button>
    </div>
   </div>`
 }).join(""):`<div style="padding:30px;text-align:center;color:#777;font-size:11px">Day ${itineraryDay} 還沒有景點<br><br>按「＋ 新增景點」開始安排。</div>`;
}
function openItinerary(day=null){
 if(day)itineraryDay=Number(day);saveItinerary();renderItinerary();
 document.getElementById("itineraryModal").classList.add("show")
}
function closeItinerary(){document.getElementById("itineraryModal").classList.remove("show")}
function populateEditorPlaces(selected=""){
 const arr=[...ALL_RECORDS].sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
 document.getElementById("editorPlace").innerHTML=arr.map(p=>`<option value="${p.id}">${p.id}｜${escapeHTML(p.display)}｜${escapeHTML(p.category)}</option>`).join("");
 if(selected)document.getElementById("editorPlace").value=selected
}
function openItinEditor(mode,day,index=-1,placeId=""){
 editorMode=mode;editorDay=Number(day);editorIndex=index;
 const item=index>=0?dayItems(editorDay)[index]:null;
 document.getElementById("editorTitle").textContent=mode==="edit"?`編輯 Day ${editorDay} 景點`:`新增到 Day ${editorDay}`;
 populateEditorPlaces(item?.id||placeId);
 document.getElementById("editorPlace").disabled=mode==="edit";
 document.getElementById("editorTime").value=item?.time||"";
 document.getElementById("editorNote").value=item?.note||"";
 document.getElementById("editorTransport").value=item?.transport||"";
 document.getElementById("itinEditor").classList.add("show")
}
function closeEditor(){document.getElementById("itinEditor").classList.remove("show")}
function saveEditor(){
 const id=document.getElementById("editorPlace").value,time=document.getElementById("editorTime").value,note=document.getElementById("editorNote").value.trim(),transport=document.getElementById("editorTransport").value.trim();
 const arr=dayItems(editorDay);
 if(editorMode==="edit"&&editorIndex>=0)arr[editorIndex]={...arr[editorIndex],time,note,transport};
 else{
   if(arr.some(x=>x.id===id)){toast(`這個景點已經在 Day ${editorDay}`);return}
   arr.push({id,time,note,transport})
 }
 saved.itinerary[String(editorDay)]=arr;
 // Keep the legacy Day filter/state compatible:
 saved.poi[id]={...poiState(id),day:String(editorDay)};
 saveItinerary();closeEditor();renderItinerary();applyFilters(false);toast("行程已儲存")
}
window.moveItin=function(day,index,dir){
 const arr=dayItems(day),j=index+dir;if(j<0||j>=arr.length)return;
 [arr[index],arr[j]]=[arr[j],arr[index]];saved.itinerary[String(day)]=arr;saveItinerary();renderItinerary()
};
window.editItin=(day,index)=>openItinEditor("edit",day,index);
window.removeItin=function(day,index){
 const arr=dayItems(day),removed=arr[index];if(!removed)return;
 if(!confirm(`從 Day ${day} 移除 ${removed.id}？`))return;
 arr.splice(index,1);saved.itinerary[String(day)]=arr;
 // Only clear legacy day if this POI isn't on another itinerary day.
 let other=null;for(let d=1;d<=14;d++)if(dayItems(d).some(x=>x.id===removed.id)){other=d;break}
 saved.poi[removed.id]={...poiState(removed.id),day:other?String(other):""};
 saveItinerary();renderItinerary();applyFilters(false)
};
window.quickAddToItinerary=function(id){
 const d=Number(saved.ui?.todayDay||itineraryDay||1);
 openItinEditor("add",d,-1,id)
};
function showDayOnMap(day){
 const arr=dayItems(day),pts=arr.map(x=>byId[x.id]).filter(Boolean);
 if(!pts.length){toast(`Day ${day} 還沒有景點`);return}
 closeItinerary();
 state.dayFilter=String(day);syncFilterControls();applyFilters(false);fitToPoints(pts,{maxZoom:16});toast(`目前地圖顯示 Day ${day} 行程`)
}
function setToday(day){
 saved.ui.todayDay=Number(day);saveItinerary();renderItinerary();toast(`今天已設定為 Day ${day}`)
}
function sortItinByTime(day){
 const arr=dayItems(day);arr.sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));saved.itinerary[String(day)]=arr;saveItinerary();renderItinerary()
}

document.getElementById("itineraryBtn").onclick=()=>openItinerary(saved.ui?.todayDay||itineraryDay);
document.getElementById("closeItinerary").onclick=closeItinerary;
document.getElementById("addItinPlace").onclick=()=>openItinEditor("add",itineraryDay);
document.getElementById("showDayMap").onclick=()=>showDayOnMap(itineraryDay);
document.getElementById("makeToday").onclick=()=>setToday(itineraryDay);
document.getElementById("setTodayBtn").onclick=()=>setToday(itineraryDay);
document.getElementById("sortByTime").onclick=()=>sortItinByTime(itineraryDay);
document.getElementById("editorCancel").onclick=closeEditor;
document.getElementById("editorSave").onclick=saveEditor;


map.on("move",()=>requestAnimationFrame(renderOverlay));map.on("zoom",()=>requestAnimationFrame(renderOverlay));map.on("resize",renderOverlay);

map.whenReady(()=>{syncFilterControls();applyView(true)});
</script>
