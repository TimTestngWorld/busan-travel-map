<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="theme-color" content="#1769aa"><title>修復釜山旅行地圖更新</title>
<style>body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:#f4f7f9;color:#243b4a;margin:0;padding:24px}.card{max-width:620px;margin:10vh auto;background:#fff;border:1px solid #dce5ea;border-radius:20px;padding:24px;box-shadow:0 14px 45px #17364c22}h1{font-size:24px;margin:0 0 10px}.ok{color:#147348;font-weight:900}.muted{color:#70808b;line-height:1.7}.box{background:#eef6fb;border-radius:12px;padding:12px;margin:14px 0;font-size:14px;line-height:1.7}button{width:100%;border:0;border-radius:12px;background:#145184;color:#fff;padding:13px;font-weight:900;font-size:16px;cursor:pointer}</style></head>
<body><div class="card"><h1>🧹 修復 App 更新快取</h1><p class="muted">這個工具只會移除釜山旅行地圖的 Service Worker 與 PWA 快取，<b>不會刪除 Day 行程、收藏、自訂景點、備註、分帳或 localStorage / IndexedDB 資料。</b></p><div class="box" id="status">準備修復…</div><button id="go">開始修復並重新開啟</button></div>
<script>
const statusEl=document.getElementById('status'),go=document.getElementById('go');
async function repair(){go.disabled=true;go.textContent='修復中…';let regs=0,cachesRemoved=0;try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();regs=rs.length;await Promise.allSettled(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();const targets=ks.filter(k=>k.startsWith('busan-travel-'));cachesRemoved=targets.length;await Promise.allSettled(targets.map(k=>caches.delete(k)))}statusEl.innerHTML=`<span class="ok">✅ 快取修復完成</span><br>Service Worker：${regs} 個已解除<br>PWA Cache：${cachesRemoved} 個已清除<br>旅行資料：未刪除`;setTimeout(()=>location.replace(`./?fresh=2.12.5&t=${Date.now()}`),700)}catch(e){statusEl.textContent='修復失敗：'+String(e?.message||e);go.disabled=false;go.textContent='再試一次'}}
go.addEventListener('click',repair);setTimeout(repair,350);
</script></body></html>
